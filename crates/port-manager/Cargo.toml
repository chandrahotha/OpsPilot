[package]
name = "pilot-port-manager"
version = "0.1.0"
edition = "2024"
description = "Port detection, conflict handling, and process ownership"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
regex = "1.10"
glob = "0.3"

[dev-dependencies]
serde_json = "1.0"