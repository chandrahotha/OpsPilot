[package]
name = "pilot-diagnostics"
version = "0.1.0"
edition = "2024"
description = "Deterministic diagnostics engine for Pilot"
license = "Apache-2.0"

[dependencies]
pilot-core = { path = "../core" }
pilot-port-manager = { path = "../port-manager" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.39", features = ["net", "time", "rt-multi-thread"] }

[dev-dependencies]
serde_json = "1.0"