name: Build and Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pilot
            asset: pilot-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: pilot
            asset: pilot-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pilot.exe
            asset: pilot-win32-x64.exe
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binary
        run: cargo build --release --bin pilot --target ${{ matrix.target }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}


  # Build Tauri desktop app
  build-tauri:
    name: Build Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: darwin
          - os: windows-latest
            target: win32
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-tauri-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install npm dependencies
        # The lockfile lives at the repo root and covers all workspaces;
        # `npm ci` must run where the lockfile is, never in a subpackage.
        run: npm ci
      - name: Build Tauri app
        working-directory: pilot/apps/desktop
        run: npm run build
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-pilot-desktop-${{ matrix.target }}
          path: pilot/apps/desktop/src-tauri/target/release/bundle/

  # Create platform-specific npm packages
  create-platform-packages:
    name: Create platform npm packages
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create platform packages
        run: |
          mkdir -p packages
          
          # Windows x64
          mkdir -p packages/cli-win32-x64/bin
          cp artifacts/pilot-win32-x64.exe packages/cli-win32-x64/bin/pilot.exe
          
          # macOS x64
          mkdir -p packages/cli-darwin-x64/bin
          cp artifacts/pilot-macos-x64 packages/cli-darwin-x64/bin/pilot
          chmod +x packages/cli-darwin-x64/bin/pilot
          
          # Linux x64
          mkdir -p packages/cli-linux-x64/bin
          cp artifacts/pilot-linux-x64 packages/cli-linux-x64/bin/pilot
          chmod +x packages/cli-linux-x64/bin/pilot
          
          # Create package.json for each platform package
          for platform in win32-x64 darwin-x64 linux-x64; do
            cat > packages/cli-${platform}/package.json << EOF
            {
              "name": "@ops-pilot/cli-${platform}",
              "version": "${{ github.ref_name }}",
              "description": "Native pilot binary for ${platform}",
              "license": "MIT",
              "os": ["${platform%%-x64}"],
              "cpu": ["x64"],
              "files": ["bin"],
              "private": true
            }
            EOF
          done
          
          echo "Created platform packages in packages/"
      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: platform-packages
          path: packages/


  # Build and test main npm package
  build-npm:
    name: Build npm package
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Bundle binary into CLI package
        run: |
          # Bundle the native binary into the CLI npm package for fallback
          mkdir -p pilot/packages/cli/bin
          
          # Include all platform binaries with platform-specific names
          cp artifacts/pilot-linux-x64 pilot/packages/cli/bin/pilot-linux-x64
          cp artifacts/pilot-macos-x64 pilot/packages/cli/bin/pilot-darwin-x64
          cp artifacts/pilot-win32-x64.exe pilot/packages/cli/bin/pilot-win32-x64.exe
          
          # Also include the current platform binary as 'pilot' for local installs
          cp artifacts/pilot-linux-x64 pilot/packages/cli/bin/pilot
      - name: Install npm dependencies
        run: npm ci
      - name: Build workspace
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (clippy, warnings deny)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: npm test
      - name: Pack npm package
        run: |
          cd pilot/packages/cli
          npm pack --dry-run 2>&1 | head -20
          npm pack
          mv *.tgz ../../../packages/
      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: ops-pilot-npm
          path: packages/*.tgz

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-tauri, create-platform-packages, build-npm]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare release assets
        run: |
          mkdir -p release
          
          # Native CLI binaries
          for asset in pilot-linux-x64 pilot-macos-x64 pilot-win32-x64.exe; do
            cp release-assets/$asset/$asset release/
          done
          
          # Tauri desktop bundles
          for dir in release-assets/ops-pilot-desktop-*/; do
            if [ -d "$dir" ]; then
              cp -r "$dir"* release/
            fi
          done
          
          # Platform npm packages
          if [ -d "release-assets/platform-packages/packages" ]; then
            cp -r release-assets/platform-packages/packages release/platform-packages
          fi
          
          # Main npm package
          if [ -f "release-assets/ops-pilot-npm/ops-pilot-*.tgz" ]; then
            cp release-assets/ops-pilot-npm/ops-pilot-*.tgz release/
          fi
          
          ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpsPilot ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to npm (skipped cleanly, not failed, when no NPM_TOKEN secret is
  # configured — the `secrets` context can't be read in a job-level `if:`,
  # so presence is checked in a step and every later step gates on that).
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-npm, create-release]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check for NPM_TOKEN secret
        id: check
        run: echo "has_token=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.has_token == 'true'
      - name: Setup Node.js
        if: steps.check.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Download npm package
        if: steps.check.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ops-pilot-npm
          path: npm-package
      - name: Download platform packages
        if: steps.check.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: platform-packages
          path: platform-artifact
      - name: Publish main CLI package
        if: steps.check.outputs.has_token == 'true'
        run: |
          TARBALL="$(find npm-package -name 'ops-pilot-*.tgz' | head -n 1)"
          if [ -z "$TARBALL" ]; then echo "no packed tarball found"; find npm-package -type f | head -n 20; exit 1; fi
          npm publish "$TARBALL" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish platform packages
        if: steps.check.outputs.has_token == 'true'
        run: |
          test -n "$(find platform-artifact -name package.json | head -n 1)" || { echo "no platform packages found"; find platform-artifact -type f | head -n 20; exit 1; }
          find platform-artifact -name package.json -exec dirname {} \; | while IFS= read -r pkg; do
            echo "Publishing $pkg..."
            npm publish "$pkg" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
