name: Build and Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pilot
            asset: pilot-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: pilot
            asset: pilot-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pilot.exe
            asset: pilot-win32-x64.exe
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        # The tag is the single source of truth for the version, so
        # `pilot --version` always matches the release it shipped in.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e 'const fs=require("fs"),p="Cargo.toml";let s=fs.readFileSync(p,"utf8");s=s.replace(/^version = "[^"]*"/m,`version = "${process.argv[1]}"`);fs.writeFileSync(p,s)' "$VERSION"
          grep -m1 '^version' Cargo.toml
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binary
        run: cargo build --release --bin pilot --target ${{ matrix.target }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error


  # Build Tauri desktop app
  build-tauri:
    name: Build Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: darwin
          - os: windows-latest
            target: win32
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-tauri-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install npm dependencies
        # The lockfile lives at the repo root and covers all workspaces;
        # `npm ci` must run where the lockfile is, never in a subpackage.
        run: npm ci
      - name: Set version from tag
        # Drives the installer filenames and the version shown in the OS
        # installer UI - without this they stay pinned at whatever is
        # committed in tauri.conf.json, regardless of the tag.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e 'const fs=require("fs"),p="pilot/apps/desktop/src-tauri/tauri.conf.json",c=JSON.parse(fs.readFileSync(p,"utf8"));c.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")' "$VERSION"
          node -e 'const fs=require("fs"),p="Cargo.toml";let s=fs.readFileSync(p,"utf8");s=s.replace(/^version = "[^"]*"/m,`version = "${process.argv[1]}"`);fs.writeFileSync(p,s)' "$VERSION"
          echo "version -> $VERSION"
      - name: Build Tauri app
        working-directory: pilot/apps/desktop
        run: npm run build
      - name: Locate bundle output
        shell: bash
        run: |
          echo "=== bundle dirs ==="
          find . -type d -name bundle -path '*release*' -not -path './node_modules/*'
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-pilot-desktop-${{ matrix.target }}
          # src-tauri is a workspace member, so cargo writes its output to
          # the workspace-root target/, not to src-tauri/target/.
          path: target/release/bundle/
          # Without this, a path that matches nothing is only a warning and
          # the job still goes green - which hid a broken path for 3 runs.
          if-no-files-found: error

  # Create platform-specific npm packages
  create-platform-packages:
    name: Create platform npm packages
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create platform packages
        run: |
          mkdir -p packages
          
          # download-artifact puts each artifact in its own dir named after
          # it, so the file lives at artifacts/<asset-name>/<binary-name>,
          # not artifacts/<asset-name> directly.
          # Windows x64
          mkdir -p packages/cli-win32-x64/bin
          cp artifacts/pilot-win32-x64.exe/pilot.exe packages/cli-win32-x64/bin/pilot.exe

          # macOS x64
          mkdir -p packages/cli-darwin-x64/bin
          cp artifacts/pilot-macos-x64/pilot packages/cli-darwin-x64/bin/pilot
          chmod +x packages/cli-darwin-x64/bin/pilot

          # Linux x64
          mkdir -p packages/cli-linux-x64/bin
          cp artifacts/pilot-linux-x64/pilot packages/cli-linux-x64/bin/pilot
          chmod +x packages/cli-linux-x64/bin/pilot
          
          # Create package.json for each platform package
          VERSION="${GITHUB_REF_NAME#v}"
          for platform in win32-x64 darwin-x64 linux-x64; do
          cat > packages/cli-${platform}/package.json <<EOF
          {
            "name": "@ops_pilot/cli-${platform}",
            "version": "${VERSION}",
            "description": "Native pilot binary for ${platform}",
            "license": "Apache-2.0",
            "os": ["${platform%%-x64}"],
            "cpu": ["x64"],
            "files": ["bin"]
          }
          EOF
          done
          
          echo "Created platform packages in packages/"
      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: platform-packages
          path: packages/
          if-no-files-found: error


  # Build and test main npm package
  build-npm:
    name: Build npm package
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Tauri/Linux)
        # This job's clippy/test steps below compile the desktop crate too,
        # which needs Tauri's Linux GTK/WebKit stack - same as check.yml.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Bundle binary into CLI package
        run: |
          # Bundle the native binary into the CLI npm package for fallback
          mkdir -p pilot/packages/cli/bin
          
          # Include all platform binaries, named as resolve-binary.js expects:
          # pilot-<platform>-<arch>[.exe]. download-artifact puts each
          # artifact in its own dir named after it, so the file lives at
          # artifacts/<asset-name>/<binary-name>, not artifacts/<asset-name>.
          cp artifacts/pilot-linux-x64/pilot pilot/packages/cli/bin/pilot-linux-x64
          cp artifacts/pilot-macos-x64/pilot pilot/packages/cli/bin/pilot-darwin-x64
          cp artifacts/pilot-win32-x64.exe/pilot.exe pilot/packages/cli/bin/pilot-win32-x64.exe
          chmod +x pilot/packages/cli/bin/pilot-linux-x64 pilot/packages/cli/bin/pilot-darwin-x64
      - name: Install npm dependencies
        run: npm ci
      - name: Build workspace
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (clippy, warnings deny)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: npm test
      - name: Set package version from tag
        # The tag normally matches the version already committed in
        # package.json, and plain `npm version` calls that an error
        # ("Version not changed") rather than a no-op.
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
        working-directory: pilot/packages/cli
      - name: Pack npm package
        run: |
          mkdir -p packages
          cd pilot/packages/cli
          npm pack --dry-run 2>&1 | head -20
          npm pack
          mv *.tgz ../../../packages/
      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: ops-pilot-npm
          path: packages/*.tgz
          if-no-files-found: error

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-tauri, create-platform-packages, build-npm]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare release assets
        run: |
          mkdir -p release
          
          # Native CLI binaries. download-artifact puts each artifact in its
          # own dir named after it, but the file inside keeps its build name
          # (pilot or pilot.exe), not the asset name - map and rename so the
          # release page shows sensibly distinct filenames per platform.
          declare -A asset_binary=(
            [pilot-linux-x64]=pilot
            [pilot-macos-x64]=pilot
            [pilot-win32-x64.exe]=pilot.exe
          )
          for asset in "${!asset_binary[@]}"; do
            cp "release-assets/$asset/${asset_binary[$asset]}" "release/$asset"
          done
          
          # Tauri desktop installers. Tauri nests each one under its bundle
          # format (deb/, appimage/, msi/, nsis/, dmg/), and action-gh-release
          # drops any path that isn't a file - so they have to be flattened
          # out of those dirs or they never reach the release at all.
          installers=0
          for dir in release-assets/ops-pilot-desktop-*/; do
            [ -d "$dir" ] || continue
            while IFS= read -r f; do
              cp "$f" release/
              installers=$((installers + 1))
            done < <(find "$dir" -type f \( -name '*.deb' -o -name '*.AppImage' \
              -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \))
          done
          if [ "$installers" -eq 0 ]; then
            echo "::error::no desktop installers found - the Tauri artifacts are missing or empty"
            find release-assets -maxdepth 2
            exit 1
          fi
          echo "collected $installers desktop installer(s)"

          # Platform npm packages, as a single archive - a bare directory
          # would be dropped by action-gh-release for the same reason.
          if [ -d "release-assets/platform-packages" ]; then
            tar -czf release/ops_pilot-platform-packages.tar.gz \
              -C release-assets/platform-packages .
          fi
          
          # Main npm package. A quoted glob never matches with `[ -f ... ]`
          # (the * stays literal), so this always silently skipped before;
          # build-npm is a hard dependency of this job, so the tarball is
          # guaranteed to exist by the time this step runs.
          cp release-assets/ops-pilot-npm/ops_pilot-cli-*.tgz release/
          
          ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpsPilot ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to npm - disabled. Publishing is done manually (hotfix-only,
  # OTP-approved) so a tag push never silently auto-publishes over an
  # already-released version. Flip `if: false` back to the tag check below
  # to re-enable automated publishing once that's actually wanted.
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-npm, create-release]
    if: false # startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check for NPM_TOKEN secret
        id: check
        run: echo "has_token=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.has_token == 'true'
      - name: Setup Node.js
        if: steps.check.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Download npm package
        if: steps.check.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ops-pilot-npm
          path: npm-package
      - name: Download platform packages
        if: steps.check.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: platform-packages
          path: platform-artifact
      - name: Publish main CLI package
        if: steps.check.outputs.has_token == 'true'
        run: |
          TARBALL="$(find npm-package -name 'ops_pilot-cli-*.tgz' | head -n 1)"
          if [ -z "$TARBALL" ]; then echo "no packed tarball found"; find npm-package -type f | head -n 20; exit 1; fi
          npm publish "$TARBALL" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish platform packages
        if: steps.check.outputs.has_token == 'true'
        run: |
          test -n "$(find platform-artifact -name package.json | head -n 1)" || { echo "no platform packages found"; find platform-artifact -type f | head -n 20; exit 1; }
          find platform-artifact -name package.json -exec dirname {} \; | while IFS= read -r pkg; do
            echo "Publishing $pkg..."
            npm publish "$pkg" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
