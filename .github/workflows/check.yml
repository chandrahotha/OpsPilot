name: Check

on:
  # Runs 3x/week on a schedule rather than on every push, by choice - keeps
  # the signal to a steady cadence instead of one run per commit. Still
  # runnable on demand from the Actions tab, and on every pull_request since
  # those are rare for a single-developer repo.
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC
    - cron: '0 3 * * 3' # Wednesday 03:00 UTC
    - cron: '0 3 * * 5' # Friday 03:00 UTC
  workflow_dispatch:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies (Tauri/Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus-x11
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (clippy, warnings deny)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        # The desktop crate links GTK/WebKit/D-Bus (Tauri's Linux backend);
        # even its plain logic tests crash on a headless runner with no
        # display or session bus to attach to. xvfb-run supplies both.
        run: xvfb-run --auto-servernum -- dbus-run-session -- cargo test --workspace
      - name: CLI tests
        run: npm run test:cli
      - name: Web build
        run: npm --workspace ops-pilot-desktop run build:web
