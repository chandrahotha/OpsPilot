name: Check

on:
  # Runs 3x/week on a schedule instead of on every push, to keep GitHub
  # Actions minutes usage low while this repo is private (private repos draw
  # from a monthly included-minutes pool; public repos don't). Still
  # runnable on demand from the Actions tab, and on every pull_request since
  # those are rare for a single-developer repo.
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC
    - cron: '0 3 * * 3' # Wednesday 03:00 UTC
    - cron: '0 3 * * 5' # Friday 03:00 UTC
  workflow_dispatch:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (clippy, warnings deny)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: CLI tests
        run: npm run test:cli
      - name: Web build
        run: npm --workspace ops-pilot-desktop run build:web
